<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin login</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>.login-container { max-width: 400px; margin: 10vh auto; }</style>
</head>
<body>
  <main class="login-container form-panel">
    <h1 style="font-size:1.75rem;text-align:center;margin-bottom:1.5rem">Admin login</h1>
    <form class="form" id="loginForm">
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div id="status" role="status" class="form__status form__status--error" hidden></div>
      <button class="btn" type="submit">Log in</button>
    </form>
  </main>
  <script type="module" src="js/admin/login.js"></script>
</body>
</html>
