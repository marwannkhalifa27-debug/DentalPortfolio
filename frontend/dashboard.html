<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding-block: 1rem; border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 3rem; padding-bottom: 4rem; }
    .case-list-item { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 0.5rem; background: var(--white); }
    .check { display: flex; gap: 0.6rem; align-items: flex-start; font-weight: 500; }
    .check input { width: auto; min-height: 0; margin-top: 0.3rem; }
    select { width: 100%; min-height: 50px; padding: 0.75rem 1rem; border: 1.5px solid var(--line); border-radius: 12px; background: var(--white); }
  </style>
</head>
<body>
  <div class="container">
    <header class="dashboard-header">
      <h1 style="font-size:1.5rem">Dashboard</h1>
      <button id="logoutBtn" type="button" class="btn btn--outline btn--small">Log out</button>
    </header>

    <div class="dashboard-grid">
      <section class="form-panel">
        <h2 style="font-size:1.4rem;margin-bottom:1rem">Add a case</h2>
        <form class="form" id="newCaseForm">
          <div class="field"><label for="title">Title</label>
            <input id="title" name="title" type="text" maxlength="120" required></div>
          <div class="field"><label for="category">Category</label>
            <select id="category" name="category" required></select></div>
          <div class="field"><label for="description">Short description</label>
            <textarea id="description" name="description" maxlength="500" style="min-height:90px" required></textarea></div>
          <div class="form__row">
            <div class="field"><label for="beforeImage">Before photo</label>
              <input id="beforeImage" name="beforeImage" type="file" accept="image/jpeg,image/png,image/webp" required></div>
            <div class="field"><label for="afterImage">After photo</label>
              <input id="afterImage" name="afterImage" type="file" accept="image/jpeg,image/png,image/webp" required></div>
          </div>
          <div class="field">
            <label class="check"><input type="checkbox" id="consent" name="patientConsent" value="true">
              <span>I have the patient's written consent to publish these photos</span></label>
            <label class="check"><input type="checkbox" id="publish" name="isPublished" value="true" disabled>
              <span>Publish on the website (needs consent)</span></label>
          </div>
          <div id="uploadStatus" role="status" class="form__status" hidden></div>
          <button class="btn" type="submit">Save case</button>
        </form>
      </section>

      <section>
        <h2 style="font-size:1.4rem;margin-bottom:1rem">Cases</h2>
        <div id="casesList">Loading…</div>
      </section>
    </div>
  </div>
  <script type="module" src="js/admin/dashboard.js"></script>
</body>
</html>
